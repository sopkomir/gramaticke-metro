<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gramatické metro</title>
<meta name="description" content="Interaktívna prechádzka slovenskou gramatikou podľa ŠVP 2023 – hlásky, pravopis, slová, slovné druhy a vety pre 1., 2., 3. cyklus a strednú školu.">
<meta name="author" content="Miroslav Sopko">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e16; --bg2:#0f1522; --card:#121a2a; --card2:#172135; --line:#24304a;
  --ink:#eef2f8; --mute:#93a0b8; --acc:#ffb020; --acc2:#ff8a00; --tq:#38e1d6;
  --ok:#34d399; --bad:#fb7185; --r:22px;
  --fh:'Space Grotesk',system-ui,sans-serif; --fb:'Space Grotesk',system-ui,sans-serif; --fm:'JetBrains Mono',ui-monospace,monospace;
  --Y:#f5b700; --R:#ef4444; --G:#22c55e; --B:#3b82f6; --P:#a855f7;
  --glow1:rgba(255,176,32,.10); --glow2:rgba(56,225,214,.08); --grid:rgba(255,255,255,.035);
  color-scheme:dark;
}
body.l1{ --bg:#fff7e8; --bg2:#ffefd2; --card:#ffffff; --card2:#fff6e6; --line:#f1dcb4; --ink:#2b2340; --mute:#7a6f8c;
  --acc:#ff9f1c; --acc2:#ff6b35; --tq:#14b8a6; --ok:#16a34a; --bad:#e11d48;
  --fh:'Fredoka',system-ui,sans-serif; --fb:'Fredoka',system-ui,sans-serif;
  --glow1:rgba(255,159,28,.18); --glow2:rgba(20,184,166,.12); --grid:rgba(43,35,64,.04); color-scheme:light; }
body.l2{ --bg:#f2f5fa; --bg2:#e8edf5; --card:#ffffff; --card2:#f6f8fc; --line:#dbe2ee; --ink:#14203a; --mute:#5f6c86;
  --acc:#f08c00; --acc2:#e8590c; --tq:#0e9f96; --ok:#15803d; --bad:#e11d48;
  --glow1:rgba(240,140,0,.10); --glow2:rgba(14,159,150,.08); --grid:rgba(20,32,58,.04); color-scheme:light; }
body.l3{ }
body.l4{ --bg:#06090e; --bg2:#0b1119; --card:#0e1620; --card2:#132030; --line:#1d2c3e; --acc:#38e1d6; --acc2:#14b8a6; --tq:#ffb020;
  --glow1:rgba(56,225,214,.10); --glow2:rgba(255,176,32,.06); }
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.5;overflow-x:hidden;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(700px 420px at 85% -5%,var(--glow1),transparent 70%),
   radial-gradient(600px 400px at -10% 30%,var(--glow2),transparent 70%),
   linear-gradient(var(--grid) 1px,transparent 1px) 0 0/32px 32px,
   linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/32px 32px;}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:var(--fh);line-height:1.15;margin:0}
.mono{font-family:var(--fm)}
/* hlavička */
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:4px;min-height:44px}
.logo svg{width:34px;height:34px;display:block}
.brand{font-family:var(--fm);font-weight:700;letter-spacing:.18em;font-size:12px}
@media(max-width:380px){.brand{font-size:10.5px;letter-spacing:.12em}}
.topbtns{display:flex;gap:6px}
.ibtn{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;padding:0}
.ibtn svg{width:22px;height:22px}
.ibtn.off{opacity:.55}
main{max-width:980px;margin:0 auto;padding:16px 16px 80px}
/* karty */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.eyebrow{font-family:var(--fm);font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);font-weight:700}
.sec{margin-top:26px}
.sechead{display:flex;align-items:baseline;gap:12px;margin:0 0 12px}
.sechead .no{font-family:var(--fm);color:var(--acc);font-weight:700}
.sechead h2{font-size:20px}
.muted{color:var(--mute)}
/* hero */
.hero{position:relative;overflow:hidden;padding:0}
.hero .scene{display:block;width:100%;height:auto}
.hero .txt{padding:18px 20px 22px}
.hero h1{font-size:clamp(28px,7vw,48px);margin:10px 0 10px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--acc)}
.hero p{margin:0 0 14px;color:var(--mute);max-width:640px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--fm);font-size:12px;border:1px solid var(--line);background:var(--card2);border-radius:999px;padding:6px 11px}
/* úrovne */
.levels{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.levels{grid-template-columns:1fr 1fr}}
.lvl{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;min-height:92px;transition:transform .15s,border-color .15s}
.lvl:hover{transform:translateY(-2px)}
.lvl.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.lvl .av{width:66px;height:66px;flex:0 0 66px;border-radius:18px;overflow:hidden}
.lvl b{display:block;font-family:var(--fh);font-size:18px}
.lvl small{display:block;color:var(--mute);font-size:13px}
.lvl .tag{font-family:var(--fm);font-size:11px;color:var(--acc);letter-spacing:.12em}
.av svg{width:100%;height:100%;display:block}
/* mapa */
.mapwrap{padding:10px 8px 14px}
.metro{width:100%;height:auto;display:block;touch-action:manipulation}
.metro .ln{fill:none;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.metro .lnbg{fill:none;stroke:var(--bg2);stroke-width:15;stroke-linecap:round;stroke-linejoin:round}
.metro .st{fill:var(--card);stroke-width:3.5}
.metro .st.done{stroke-width:0}
.metro .term{cursor:pointer}
.metro text{font-family:var(--fm);font-size:11px;font-weight:700;fill:var(--ink)}
.metro .hit{fill:transparent;stroke:transparent;stroke-width:28;cursor:pointer}
.metro .center{cursor:pointer}
.metro .train{filter:drop-shadow(0 0 4px rgba(255,255,255,.6))}
.legend{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
@media(min-width:640px){.legend{grid-template-columns:1fr 1fr}}
.lline{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:56px;position:relative}
.lline .dot{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;color:#fff;font-family:var(--fm);font-weight:700;font-size:13px}
.lline b{display:block;font-family:var(--fh)}
.lline small{color:var(--mute);font-size:12.5px;display:block}
.lline .bar{height:5px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.lline .bar i{display:block;height:100%;border-radius:9px}
.lline .stamp{margin-left:auto}
.stampmini{font-family:var(--fm);font-size:10px;letter-spacing:.1em;border:2px solid var(--ok);color:var(--ok);border-radius:8px;padding:3px 6px;transform:rotate(-8deg);display:inline-block;font-weight:700}
.prog{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:12.5px;color:var(--mute)}
.prog .bar{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2))}
/* tlačidlá */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:999px;border:0;font-weight:700;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1206;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
body.l4 .btn:not(.ghost){color:#03201e}
.btn.ghost{background:var(--card2);color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.sm{min-height:40px;padding:8px 14px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* kapitola */
.chHead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.chHead h1{font-size:clamp(20px,5vw,28px)}
.chHead .ring{margin-left:auto;flex:0 0 52px}
.guide{display:flex;gap:14px;align-items:flex-start}
.guide .av{width:64px;height:64px;flex:0 0 64px;border-radius:18px;overflow:hidden}
.bubble{position:relative;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;flex:1}
.bubble p{margin:0 0 8px}
@media(max-width:640px){.guide{flex-direction:column;gap:10px}.guide .av{width:52px;height:52px;flex-basis:52px}.bubble{font-size:15px}}
.bubble .who{font-family:var(--fm);font-size:11px;letter-spacing:.14em;color:var(--acc);text-transform:uppercase;font-weight:700}
.pills{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 10px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:44px;font-size:14px;font-weight:600;white-space:nowrap}
.pill .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-family:var(--fm);font-size:11px;border:2px solid var(--lc,var(--acc))}
.pill.on{border-color:var(--lc,var(--acc));background:color-mix(in srgb,var(--lc,var(--acc)) 14%,var(--card))}
.pill.done .n{background:var(--lc,var(--acc));color:#fff;border-color:transparent}
.task h2{font-size:20px;margin-bottom:6px}
.task .ask{margin:0 0 14px;color:var(--mute)}
.task .ask b{color:var(--ink)}
.cnt{font-family:var(--fm);font-size:12px;color:var(--mute);letter-spacing:.08em}
details.hint{margin-top:14px;border:1px dashed var(--line);border-radius:14px;padding:8px 12px}
details.hint summary{cursor:pointer;font-weight:600;color:var(--acc);min-height:30px;display:flex;align-items:center}
/* úlohy - spoločné */
.big{font-family:var(--fh);font-size:clamp(28px,8vw,44px);font-weight:700;text-align:center;padding:20px 10px;border-radius:18px;background:var(--card2);border:1px solid var(--line);margin:6px 0 14px;position:relative;word-break:break-word}
.big.sm{font-size:clamp(19px,5vw,25px);font-weight:600;line-height:1.35}
.big .gap{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--acc);color:var(--acc)}
.big .hl{background:color-mix(in srgb,var(--acc) 26%,transparent);border-radius:8px;padding:0 4px;box-shadow:inset 0 -3px 0 var(--acc)}
.say{position:absolute;right:8px;top:8px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center}
.say svg{width:20px;height:20px}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.bins.b3{grid-template-columns:repeat(3,1fr)}.bins.b4{grid-template-columns:repeat(4,1fr)}}
.bin{min-height:58px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:10px;font-weight:600;line-height:1.2}
.bin small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:2px}
.bin:hover,.opt:hover{border-color:var(--acc)}
.opts{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){.opts.two{grid-template-columns:1fr 1fr}}
.opts.inline{grid-template-columns:repeat(auto-fit,minmax(74px,1fr))}
.opt{min-height:52px;text-align:left;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:10px 14px;font-weight:600}
.opts.inline .opt{text-align:center;font-size:22px;font-family:var(--fh)}
.opt.good,.bin.good,.tok.good,.pr.good{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 16%,var(--card))!important}
.opt.badx,.bin.badx,.tok.badx,.pr.badx{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 14%,var(--card))!important}
.fb{min-height:26px;margin-top:12px;font-weight:600}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.fb .why{display:block;font-weight:400;color:var(--ink);opacity:.85;margin-top:4px}
.shake{animation:shk .38s}
@keyframes shk{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.92)}60%{transform:scale(1.04)}100%{transform:scale(1)}}
/* ťukanie na slová */
.sent{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:baseline;padding:16px 12px;background:var(--card2);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}
.tok{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:7px 10px;min-height:44px;font-size:19px;font-weight:600;font-family:var(--fh)}
.tok.p{border:0;background:none;padding:0 2px 0 0;min-height:auto;margin-left:-6px;font-size:20px}
.tok.show{border-style:dashed;border-color:var(--ok)}
/* čiarky */
.cline{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px;padding:16px 10px;background:var(--card2);border:1px solid var(--line);border-radius:18px;font-family:var(--fh);font-size:20px;font-weight:600}
.cw{padding:0 2px}
.slot{width:26px;height:40px;margin:0 1px;border-radius:9px;border:1.5px dashed color-mix(in srgb,var(--mute) 40%,transparent);background:none;display:inline-grid;place-items:center;font-size:24px;font-weight:800;color:var(--acc);padding:0}
.slot:hover{border-color:var(--line)}
.slot.on{border-color:var(--acc)}
.slot.miss{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 18%,transparent)}
.slot.extra{border-color:var(--bad);color:var(--bad)}
/* skladanie */
.ans{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:18px;border:2px dashed var(--line);margin-bottom:12px;align-items:center}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 14px;min-height:46px;font-size:19px;font-weight:700;font-family:var(--fh)}
.ans .tile{background:color-mix(in srgb,var(--acc) 14%,var(--card));border-color:var(--acc)}
/* páry */
.pairs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcol{display:flex;flex-direction:column;gap:10px}
.pr{min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:8px 10px;font-weight:600}
.pr.sel{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 25%,transparent)}
.pr:disabled{opacity:.55}
/* slabiky */
.split{display:flex;justify-content:center;flex-wrap:wrap;align-items:center;padding:18px 6px;background:var(--card2);border:1px solid var(--line);border-radius:18px;font-family:var(--fh);font-size:34px;font-weight:700;margin-bottom:12px}
.split .slot{height:52px;width:28px;font-size:30px}
/* výhra */
.win{text-align:center;padding:10px 0 4px}
.win .medal{width:84px;height:84px;margin:0 auto 6px}
.stamp{display:inline-block;font-family:var(--fm);font-weight:800;letter-spacing:.16em;color:var(--ok);border:3px solid var(--ok);border-radius:12px;padding:8px 14px;transform:rotate(-7deg);margin:10px 0;animation:stp .5s ease-out}
@keyframes stp{0%{transform:scale(2.2) rotate(-7deg);opacity:0}100%{transform:scale(1) rotate(-7deg);opacity:1}}
.clue{border-left:4px solid var(--acc);background:var(--card2);border-radius:12px;padding:10px 14px;text-align:left;margin:12px 0}
/* termíny */
.term{background:none;border:0;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--acc);cursor:help}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;overflow:auto;background:var(--card);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:8px 18px 26px;transform:translateY(105%);transition:transform .25s;max-width:760px;margin:0 auto}
.sheet{visibility:hidden}.sheet.on{transform:none;visibility:visible}
.grab{width:46px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.gl{border-bottom:1px solid var(--line);padding:10px 0}
.gl b{font-family:var(--fh)}
.gsearch{width:100%;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px 14px;font:inherit;margin:6px 0 4px}
/* úvodná animácia */
.intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:28px;overflow:hidden}
.intro.on{display:flex}
.intro .num{position:absolute;right:-10px;bottom:-40px;font-family:var(--fm);font-weight:800;font-size:min(62vw,420px);line-height:1;color:transparent;-webkit-text-stroke:2px var(--lc);opacity:.35}
.intro .ln3{font-family:var(--fh);font-size:clamp(22px,6vw,38px);font-weight:700;max-width:720px;margin:0 0 10px;opacity:0;filter:blur(10px);transform:translateY(10px);transition:all .7s}
.intro .ln3.v{opacity:1;filter:none;transform:none}
.intro .learn{color:var(--mute);max-width:620px;opacity:0;transition:opacity .6s}
.intro .learn.v{opacity:1}
.intro .bar0{width:70px;height:8px;border-radius:9px;background:var(--lc);margin-bottom:20px}
/* skúška */
.timer{font-family:var(--fm);font-weight:700;font-size:18px}
.res{display:grid;gap:8px;margin:12px 0}
.resrow{display:flex;align-items:center;gap:10px}
.resrow .bar{flex:1;height:10px;border-radius:9px;background:var(--line);overflow:hidden}
.resrow .bar i{display:block;height:100%}
.cert{border:3px double var(--acc);border-radius:22px;padding:24px 18px;text-align:center;background:var(--card2);margin-top:14px}
.cert h2{font-size:26px;margin:8px 0}
.cert .nm{font-family:var(--fh);font-size:30px;font-weight:700;color:var(--acc);margin:8px 0}
.nameIn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--ink);padding:10px 14px;font:inherit;width:100%;max-width:340px}
.foot{margin-top:34px;color:var(--mute);font-size:13px;text-align:center}
.foot a{color:inherit}
/* najmladší: väčšie ciele */
body.l1 .bin,body.l1 .opt{min-height:64px;font-size:19px}
body.l1 .tok{font-size:22px}
body.l1 .task h2{font-size:23px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{
  .top,.noprint,.foot,.sheet,.scrim{display:none!important}
  body{background:#fff;color:#000}
  body:before{display:none}
  .cert{border-color:#000;background:#fff}
  .cert .nm{color:#000}
}

/* ===== Témy úrovní ===== */
.heroimg{position:relative;overflow:hidden}
.heroimg svg{display:block;width:100%;height:auto}
.intro .igo{margin-top:22px;align-self:flex-start;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s}
.intro .igo.v{opacity:1;transform:none}

/* ---------- 1. cyklus: detský, kreslený, „nálepky“ ---------- */
body.l1{ --bg:#fff4db; --bg2:#ffe9bd; --card:#ffffff; --card2:#fff8ea; --line:#f0d7a6; --ink:#2b2340; --mute:#6f6384; --acc:#ff8a1f; --acc2:#ff5d5d; --r:26px; }
body.l1:before{background:
  radial-gradient(circle,rgba(255,138,31,.16) 2.4px,transparent 3px) 0 0/28px 28px,
  radial-gradient(900px 500px at 90% -10%,rgba(77,171,247,.22),transparent 70%),
  radial-gradient(700px 500px at -10% 40%,rgba(204,93,232,.12),transparent 70%)}

<script>
'use strict';
/* ===== Gramatické metro – jadro (Miroslav Sopko, zavretaskola.sk) ===== */
const $=(s,r=document)=>r.querySelector(s);
function el(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v=attrs[k]; if(v==null||v===false) continue;
    if(k==='class') e.className=v;
    else if(k==='html') e.innerHTML=v;
    else if(k==='style') e.style.cssText=v;
    else if(k.startsWith('on')) e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; e.append(c.nodeType?c:document.createTextNode(c)); }
  return e;
}
const rnd=n=>Math.floor(Math.random()*n);
const pick=a=>a[rnd(a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]];}return a;};
const sample=(a,k)=>shuffle(a).slice(0,k);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().trim();
/* slovenské skloňovanie čísel: 1 úloha / 2–4 úlohy / 5+ úloh */
const pl=(n,a,b,c)=>n+' '+(n===1?a:(n>=2&&n<=4?b:c));
/* pojmy zo slovníka: [[pojem]] alebo [[pojem|tvar]] */
const gl=s=>String(s).replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>`<button class="term" data-t="${a}">${b||a}</button>`);

/* ---- úložisko ---- */
const KEY='gmetro-v1';
let S={lv:null,done:{},quiz:{},exam:{},mute:false,name:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) S=Object.assign(S,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---- zvuk ---- */
let AC=null;
function beep(ok){
  if(S.mute) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const t=AC.currentTime, notes=ok?[660,880]:[220,170];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'triangle':'sawtooth';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(ok?.16:.07,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(0.0001,t+i*.09+.18);
      o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.2);});
  }catch(e){}
}
function fanfare(){ if(S.mute) return; [0,1,2].forEach(i=>setTimeout(()=>beep(true),i*160)); }
/* ---- čítanie nahlas ---- */
/* text, ktorý sa číta nahlas (rovnaký kľúč používa aj generátor nahrávok) */
const ttsText=t=>String(t).replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>b||a).replace(/_+/g,' … ').replace(/\s+/g,' ').trim();
function audioKey(t){ let h=0x811c9dc5; for(let i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,0x01000193)>>>0; }
  const s=t.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  return (s||'x')+'-'+h.toString(16).padStart(8,'0'); }
/* nahrávky: voliteľný súbor zvuky.js vedľa index.html (window.ZVUKY = {kľúč: base64 mp3}) */
let ZV=null, zvP=null, curAudio=null;
function loadZV(){ if(zvP) return zvP; zvP=new Promise(res=>{ try{ const sc=document.createElement('script'); sc.src='zvuky.js'; sc.async=true;
  sc.onload=()=>{ ZV=window.ZVUKY||{}; res(); }; sc.onerror=()=>{ ZV={}; res(); }; document.head.append(sc); }catch(e){ ZV={}; res(); } }); return zvP; }
function ttsSpeak(t){
  try{
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    u.lang='sk-SK'; u.rate=.92;
    const sk=speechSynthesis.getVoices().filter(v=>/^sk/i.test(v.lang)); const v=sk.find(v=>/natural|online|neural|wavenet/i.test(v.name))||sk[0]; if(v) u.voice=v; /* prednostne neurónový hlas (napr. Microsoft Viktoria Online v Edge) */
    speechSynthesis.speak(u);
  }catch(e){}
}
function speak(txt){
  const t=ttsText(txt); if(!t) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  if(curAudio){ try{curAudio.pause();}catch(e){} curAudio=null; }
  if(!ZV) loadZV();
  const d=ZV&&ZV[audioKey(t)];
  if(d){ curAudio=new Audio('data:audio/mpeg;base64,'+d); curAudio.play().catch(()=>ttsSpeak(t)); return; }
  ttsSpeak(t);
}

function sorter(box,cfg,ok){
  let items=cfg.items(); const n=Math.min(cfg.cnt||8,items.length); items=sample(items,n);

    if(cfg.speak!==false) big.append(sayBtn(it.say||it.t));

    bins.forEach(b=>grid.append(el('button',{class:'bin',html:b.label+(b.sub?`<small>${b.sub}</small>`:''),onclick:e=>choose(b,e.currentTarget)})));
  }

    else{ miss++; node.classList.add('badx'); shake(node); beep(false); say(fb,false,'Ešte raz. '+(b.hint||''),it.hint||'');
      if(miss>=3&&!solve.children.length) solve.append(el('button',{class:'btn ghost sm',onclick:()=>{
        const right=bins.find(x=>x.id===it.b); [...grid.children].forEach((x,k)=>{x.disabled=true; if(bins[k]===right) x.classList.add('good');});
        say(fb,true,'Riešenie: '+right.label.replace(/<[^>]+>/g,''),it.why); solve.innerHTML=''; next(); }},'Ukáž riešenie')); }

/* Ťukanie na slová vo vete */
function tapper(box,cfg,ok){
  const n=cfg.cnt||3; let i=0;
  const cnt=counter(box,n); cnt(0);
  const ask=box.appendChild(el('p',{class:'ask'}));
  const sent=box.appendChild(el('div',{class:'sent'}));
  const fb=feedback(box);
  const row=box.appendChild(el('div',{class:'row',style:'margin-top:8px'}));
  const used=[];
  function show(){
    let r,t=0; do{ r=cfg.gen(); t++; }while(used.includes(r.key)&&t<25); used.push(r.key);
    let miss=0,found=0; const need=r.tokens.filter(x=>x.on).length;
    ask.innerHTML=gl(r.prompt)+` <span class="cnt">(${pl(need,'slovo','slová','slov')})</span>`;
    sent.innerHTML=''; row.innerHTML=''; fb.innerHTML=''; fb.className='fb';
    r.tokens.forEach(tk=>{
      if(tk.p){ sent.append(el('span',{class:'tok p'},tk.t)); return; }
      const b=el('button',{class:'tok',onclick:()=>{
        if(b.disabled) return;
        if(tk.on){ b.classList.add('good'); b.disabled=true; if(tk.fix) b.textContent=tk.fix; found++; beep(true);
          if(found===need){ say(fb,true,'Všetky sú nájdené!',r.why); i++; cnt(i); row.innerHTML='';
            if(i>=n) setTimeout(ok,900); else row.append(el('button',{class:'btn sm',onclick:show},'Ďalšia veta',el('span',{html:ic('arrow',18)}))); }
          else say(fb,true,`Áno. Zostáva ${need-found}.`); }
        else{ miss++; b.classList.add('badx'); shake(b); beep(false); setTimeout(()=>b.classList.remove('badx'),700); say(fb,false,(tk.no||'Toto nie.'),r.hint||'');
          if(miss>=3&&!row.children.length) row.append(el('button',{class:'btn ghost sm',onclick:()=>{ r.tokens.forEach((t2,k)=>{ if(t2.on){ const nd=sent.children[k]; if(nd&&!nd.disabled) nd.classList.add('show'); } }); row.innerHTML=''; say(fb,true,'Hľadané slová sú orámované prerušovanou čiarou. Ťukni na ne.',r.why); }},'Ukáž riešenie')); }
      }},tk.t);
      sent.append(b);
    });
  }
  show();
}

/* Čiarky medzi slová */
function commas(box,cfg,ok){
  const n=cfg.cnt||3; let i=0; const pool=shuffle(cfg.pool);
  const cnt=counter(box,n); cnt(0);
  const line=box.appendChild(el('div',{class:'cline'}));
  const fb=feedback(box);
  const row=box.appendChild(el('div',{class:'row',style:'margin-top:10px'}));
  let words,need,slots,fails;
  function show(){
    const item=pool[i%pool.length]; const s=typeof item==='string'?item:item.s; const why=item.why||'';
    fails=0; line.innerHTML=''; row.innerHTML=''; fb.innerHTML=''; fb.className='fb';
    words=s.split(' '); need=new Set(); slots=[];
    words.forEach((w,k)=>{ const c=w.endsWith(','); if(c){need.add(k); w=w.slice(0,-1);} words[k]=w; });
    words.forEach((w,k)=>{
      line.append(el('span',{class:'cw'},w));
      if(k<words.length-1){ const sl=el('button',{class:'slot','aria-label':'miesto pre čiarku',onclick:()=>{sl.classList.toggle('on'); sl.textContent=sl.classList.contains('on')?',':''; sl.classList.remove('miss','extra');}}); slots.push(sl); line.append(sl); }
    });
    row.append(el('button',{class:'btn sm',onclick:()=>check(why)},'Skontrolovať'));
    row.append(el('span',{class:'muted',style:'font-size:14px'},'Ťukni medzi slová, kam patrí čiarka.'));
  }
  function check(why){
    let bad=0;
    slots.forEach((sl,k)=>{ const on=sl.classList.contains('on'), want=need.has(k);
      if(on&&!want){sl.classList.add('extra');bad++;} if(!on&&want){ if(fails>=1) sl.classList.add('miss'); bad++; } });
    if(!bad){ beep(true); say(fb,true,'Čiarky sú na správnom mieste!',why); i++; cnt(i); row.innerHTML='';
      if(i>=n) setTimeout(ok,1000); else row.append(el('button',{class:'btn sm',onclick:show},'Ďalšia veta',el('span',{html:ic('arrow',18)}))); return; }
    fails++; beep(false); shake(line);
    say(fb,false,fails===1?`Niečo nesedí (${pl(bad,'chyba','chyby','chýb')}). Červené miesta sú navyše.`:'Červeno orámované miesta chýbajú alebo sú navyše.',cfg.hint||'');
    if(fails>=3&&row.children.length<3) row.append(el('button',{class:'btn ghost sm',onclick:()=>{ slots.forEach((sl,k)=>{ const w=need.has(k); sl.classList.toggle('on',w); sl.textContent=w?',':''; sl.classList.remove('miss','extra'); }); say(fb,true,'Takto je to správne.',why); }},'Ukáž riešenie'));
  }
  show();
}

    });
    row.append(el('button',{class:'btn sm',onclick:check},'Skontrolovať'),el('button',{class:'btn ghost sm',onclick:()=>{[...ans.children].forEach(t=>tiles.append(t));picked=[];}},'Vymazať'));

      if(i>=n) setTimeout(ok,900); else row.append(el('button',{class:'btn sm',onclick:show},'Ďalej',el('span',{html:ic('arrow',18)}))); return; }
    fails++; beep(false); shake(ans); say(fb,false,'Ešte to nesedí.',it.hint||cfg.hint||'');
    if(fails>=3&&row.children.length<3) row.append(el('button',{class:'btn ghost sm',onclick:()=>{ [...ans.children].forEach(t=>tiles.append(t)); it.parts.forEach(pt=>{ const t=[...tiles.children].find(x=>x.textContent===pt); if(t) ans.append(t); }); say(fb,true,'Riešenie: '+(it.show||it.parts.join(cfg.sep??''))+'. Ťukni na Skontrolovať.'); }},'Ukáž riešenie'));
  }
  show();

/* Delenie na slabiky */
function splitter(box,cfg,ok){
  const n=cfg.cnt||5; let i=0; const pool=shuffle(cfg.pool);
  const cnt=counter(box,n); cnt(0);
  const line=box.appendChild(el('div',{class:'split'}));
  const fb=feedback(box);
  const row=box.appendChild(el('div',{class:'row',style:'margin-top:10px'}));
  let units,need,slots,fails;
  function show(){
    const w=pool[i%pool.length]; fails=0; row.innerHTML=''; fb.innerHTML=''; fb.className='fb'; line.innerHTML='';
    /* zápis "ko-ru-na"; jednotky: ch, dz, dž, ia, ie, iu sa nedelia */
    units=[]; need=new Set(); const parts=w.split('-'); let pos=0;
    parts.forEach((p,k)=>{ const u=p.match(/ch|dž|dz|ia|ie|iu|./g); u.forEach(x=>units.push(x)); pos+=u.length; if(k<parts.length-1) need.add(pos-1); });
    slots=[];
    units.forEach((u,k)=>{ line.append(el('span',null,u)); if(k<units.length-1){ const sl=el('button',{class:'slot','aria-label':'deliť tu',onclick:()=>{sl.classList.toggle('on');sl.textContent=sl.classList.contains('on')?'-':'';sl.classList.remove('extra','miss');}}); slots.push(sl); line.append(sl);} });
    line.prepend(sayBtnInline(w.replace(/-/g,'')));
    row.append(el('button',{class:'btn sm',onclick:check},'Skontrolovať'));
  }
  function sayBtnInline(t){ const b=sayBtn(t); b.style.cssText='position:static;margin-right:10px'; return b; }
  function check(){
    let bad=0; slots.forEach((sl,k)=>{ const on=sl.classList.contains('on'),want=need.has(k); if(on&&!want){sl.classList.add('extra');bad++;} if(!on&&want){ if(fails) sl.classList.add('miss'); bad++; } });
    if(!bad){ beep(true); say(fb,true,'Správne rozdelené!','Každá slabika má jednu samohlásku, dvojhlásku alebo slabikotvorné r, l.'); i++; cnt(i); row.innerHTML='';
      if(i>=n) setTimeout(ok,900); else row.append(el('button',{class:'btn sm',onclick:show},'Ďalšie slovo',el('span',{html:ic('arrow',18)}))); return; }
    fails++; beep(false); shake(line); say(fb,false,'Ešte nie.','Vytlieskaj slovo. Koľkokrát tlieskneš, toľko je slabík.');
    if(fails>=3&&row.children.length<2) row.append(el('button',{class:'btn ghost sm',onclick:()=>{ slots.forEach((sl,k)=>{const w=need.has(k);sl.classList.toggle('on',w);sl.textContent=w?'-':'';sl.classList.remove('extra','miss');}); }},'Ukáž riešenie'));
  }
  show();
}

/* vetu "Malý/A pes/P beží/S ." rozloží na tokeny s tagom */
function parseTagged(s){
  return s.trim().split(/\s+/).map(w=>{
    if(/^[.,!?:;…]+$/.test(w)) return {t:w,p:true};
    const i=w.lastIndexOf('/'); return i<0?{t:w.replace(/_/g,' '),tag:''}:{t:w.slice(0,i).replace(/_/g,' '),tag:w.slice(i+1)};
  });
}

const LC=['#f5b700','#ef4444','#22c55e','#3b82f6','#a855f7'];

  const win=[...Array(6)].map((_,i)=>`<rect x="${312+i*58}" y="182" width="40" height="34" rx="6" fill="#ffe7a3"><animate attributeName="fill" values="#ffe7a3;#fff3cf;#ffe7a3" dur="${2+i*.37}s" repeatCount="indefinite"/></rect>`).join('');
  return `<svg class="scene" viewBox="0 0 800 300" role="img" aria-label="Nočná stanica metra s vlakom">
  <defs><linearGradient id="tg3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141c2e"/><stop offset="1" stop-color="#070a12"/></linearGradient>
  <radialGradient id="vp3" cx=".75" cy=".43" r=".5"><stop offset="0" stop-color="#ffb020" stop-opacity=".35"/><stop offset="1" stop-color="#ffb020" stop-opacity="0"/></radialGradient>

  <rect width="800" height="300" fill="url(#tg3)"/><rect width="800" height="300" fill="url(#vp3)"/>

const PATHS={h:'M40 30 H130 L200 100 V160',p:'M375 40 V90 L305 160 H200',s:'M370 290 H330 L200 160',t:'M30 290 H70 L200 160',v:'M25 110 L75 160 H200'};
const LBL={h:[40,22,'start'],p:[375,32,'end'],s:[370,308,'end'],t:[30,308,'start'],v:[22,100,'start']};
function lineStats(lv,L){ const ts=L.tasks[lv]; const d=ts.filter(t=>S.done[lv+':'+t]).length; const q=!!S.quiz[lv+':'+L.id]; return {d,n:ts.length,q,all:d===ts.length&&q,pct:Math.round(100*(d+(q?1:0))/(ts.length+1))}; }
function metroMap(lv){
  const svgNS='http://www.w3.org/2000/svg';
  const wrap=el('div',{class:'card mapwrap'});
  const svg=document.createElementNS(svgNS,'svg'); svg.setAttribute('viewBox','0 0 400 320'); svg.setAttribute('class','metro'); svg.setAttribute('role','img'); svg.setAttribute('aria-label','Mapa liniek gramatického metra');
  let html='';
  LINES.forEach(L=>{ html+=`<path class="lnbg" d="${PATHS[L.id]}"/>`; });
  LINES.forEach(L=>{ const st=lineStats(lv,L); html+=`<path class="ln" id="ln-${L.id}" d="${PATHS[L.id]}" stroke="${L.c}" stroke-opacity="${st.d||st.q?1:.55}"/>`; });
  LINES.forEach(L=>{ const [x,y,a]=LBL[L.id]; html+=`<text x="${x}" y="${y}" text-anchor="${a}">${L.no} · ${L.name.split(' ')[0].toUpperCase()}</text>`; });
  svg.innerHTML=html;
  wrap.append(svg);
  /* stanice rozmiestnime po dĺžke cesty */
  requestAnimationFrame(()=>{
    LINES.forEach(L=>{
      const p=svg.querySelector('#ln-'+L.id); if(!p||!p.getTotalLength) return; const len=p.getTotalLength();
      const ts=L.tasks[lv]; const n=ts.length+1;

      for(let k=0;k<n;k++){ const pt=p.getPointAtLength(len*(0.02+0.7*k/(n-1))); const done=k<ts.length?S.done[lv+':'+ts[k]]:S.quiz[lv+':'+L.id];
        gi+= k===n-1?`<rect x="${pt.x-8}" y="${pt.y-8}" width="16" height="16" rx="4" class="st${done?' done':''}" stroke="${L.c}" fill="${done?L.c:'var(--card)'}"/>`
                    :`<circle cx="${pt.x}" cy="${pt.y}" r="7.5" class="st${done?' done':''}" stroke="${L.c}" fill="${done?L.c:'var(--card)'}"/>`; }
      const st=lineStats(lv,L);

      g.innerHTML=gi; g.addEventListener('click',()=>openLine(L.id)); g.addEventListener('keydown',e=>{if(e.key==='Enter')openLine(L.id);});

    c.addEventListener('click',()=>openExam()); c.addEventListener('keydown',e=>{if(e.key==='Enter')openExam();});
    svg.append(c);
  });
  /* legenda = prístupné tlačidlá liniek */
  const leg=el('div',{class:'legend'});
  LINES.forEach(L=>{ const st=lineStats(lv,L);
    leg.append(el('button',{class:'lline',onclick:()=>openLine(L.id)},
      el('span',{class:'dot',style:`background:${L.c}`},String(L.no)),
      el('span',{style:'flex:1;min-width:0'},el('b',null,L.name),el('small',null,`${L.sub} · ${st.d}/${st.n} staníc${st.q?' · kvíz ✔':''}`),el('div',{class:'bar'},el('i',{style:`width:${st.pct}%;background:${L.c}`}))),
      st.all?el('span',{class:'stamp'},el('span',{class:'stampmini'},'OBNOVENÁ')):null));

  leg.append(el('button',{class:'lline',onclick:()=>openExam()},el('span',{class:'dot',style:'background:var(--ink);color:var(--bg)'},'★'),el('span',{style:'flex:1'},el('b',null,'Centrálna stanica'),el('small',null,ex?`záverečná skúška · najlepšie ${ex.best} %`:'záverečná skúška s odznakom'))));
  wrap.append(leg);

}

/* ---------- prevod úlohy na otázku do skúšky ---------- */
const strip=s=>String(s).replace(/<[^>]+>/g,'').replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g,(m,a,b)=>b||a);

function toMC(id){
  const t=T[id]; const head=`<small class="muted">${strip(t.ask||t.n)}</small><br>`;
  try{
  if(t.kind==='sort'){ const items=t.items(); const bins=t.bins(items); const it=pick(items); const lab=b=>strip(b.label);
    return {q:`${t.mq} <b>${it.t}</b>?`,a:lab(bins.find(b=>b.id===it.b)),opts:lim4(lab(bins.find(b=>b.id===it.b)),bins.map(lab)),why:it.why}; }
  if(t.kind==='rounds'){ const q=t.gen(); return {q:head+q.q,a:q.a,opts:lim4(q.a,q.opts),why:q.why}; }
  if(t.kind==='tap'){ const r=t.gen(); const words=r.tokens.filter(x=>!x.p); const on=words.filter(x=>x.on); if(!on.length) return null; const a=pick(on).t;
    const others=[...new Set(words.filter(x=>!x.on).map(x=>x.t))]; if(others.length<2) return null;
    const sent=r.tokens.map(x=>x.t).join(' ').replace(/ ([.,!?])/g,'$1');
    return {q:`Ktoré slovo vo vete <b>„${sent}“</b> je <b>${r.label}</b>?`,a,opts:lim4(a,others),why:strip(r.why||'')}; }
  if(t.kind==='comma'){ const it=pick(t.pool); const s=it.s; const words=s.split(' ');
    const v=new Set(); const noC=s.replace(/,/g,''); if(noC!==s) v.add(noC);
    const ci=words.map((w,k)=>w.endsWith(',')?k:-1).filter(k=>k>=0);
    if(ci.length>1){ const w2=words.slice(); w2[ci[0]]=w2[ci[0]].slice(0,-1); v.add(w2.join(' ')); }
    for(let tries=0;tries<10&&v.size<3;tries++){ const k=rnd(words.length-1); if(!words[k].endsWith(',')){ const w3=words.slice(); w3[k]+=','; v.add(w3.join(' ')); } }
    v.delete(s); return {q:'Ktorý zápis má čiarky správne?',a:s,opts:[s,...[...v].slice(0,3)],why:it.why||''}; }
  if(t.kind==='pairs'){ const set=sample(t.pool,4); const p=set[0]; return {q:head+`Čo patrí k <b>${p[0]}</b>?`,a:p[1],opts:set.map(x=>x[1]),why:`${p[0]} – ${p[1]}`}; }
  if(t.kind==='split'){ const w=pick(t.pool); const parts=w.split('-'); const flat=w.replace(/-/g,'');
    const alts=new Set(); if(parts.length>1) alts.add(flat);
    for(let k=0;k<parts.length-1;k++){ if(parts[k].length>1){ const p2=parts.slice(); p2[k+1]=p2[k].slice(-1)+p2[k+1]; p2[k]=p2[k].slice(0,-1); alts.add(p2.join('-')); } if(parts[k+1].length>1){ const p3=parts.slice(); p3[k]=p3[k]+p3[k+1][0]; p3[k+1]=p3[k+1].slice(1); alts.add(p3.join('-')); } }
    alts.delete(w); return {q:'Ktoré rozdelenie na slabiky je správne?',a:w,opts:[w,...shuffle([...alts]).slice(0,3)],why:'Každá slabika má jednu samohlásku, dvojhlásku alebo slabikotvorné r, l.'}; }
  }catch(e){ console.warn(e); }
  return null;
}

  const key=Object.keys(GLOSS).find(k=>k===t)||Object.keys(GLOSS).find(k=>norm(k)===norm(t));
  const d=key?GLOSS[key]:'Tento pojem zatiaľ v slovníku nie je.';
  openSheet(el('div',null,el('div',{class:'eyebrow'},'Slovník pojmov'),el('h2',{style:'margin:6px 0 8px'},key||t),el('p',null,d),
    el('div',{class:'row'},el('button',{class:'btn ghost sm',onclick:()=>speak((key||t)+'. '+d)},el('span',{html:ic('speak',18)}),'Prečítať'),el('button',{class:'btn ghost sm',onclick:glossSheet},'Celý slovník'),el('button',{class:'btn sm',onclick:closeSheet},'Zavrieť'))));
}
function glossSheet(){
  const list=el('div'); const inp=el('input',{class:'gsearch',placeholder:'Hľadať pojem…','aria-label':'Hľadať pojem'});
  const keys=Object.keys(GLOSS).sort((a,b)=>a.localeCompare(b,'sk'));
  const draw=()=>{ const f=norm(inp.value); list.innerHTML=''; keys.filter(k=>!f||norm(k).includes(f)||norm(GLOSS[k]).includes(f)).forEach(k=>list.append(el('div',{class:'gl'},el('b',null,k),el('div',{class:'muted',style:'font-size:14.5px'},GLOSS[k])))); };
  inp.addEventListener('input',draw); draw();
  openSheet(el('div',null,el('div',{class:'row',style:'justify-content:space-between'},el('h2',null,`Slovník · ${keys.length} pojmov`),el('button',{class:'btn sm',onclick:closeSheet},'Zavrieť')),inp,list));
}

/* celá obrazovka – funguje aj vnútri iframe (allow="fullscreen"); kde API chýba (iPhone), otvorí appku v novom okne */
(function(){
  const b=$('#btnFull'), d=document, root=d.documentElement;
  const can=!!(d.fullscreenEnabled||d.webkitFullscreenEnabled), inFrame=(()=>{try{return window.self!==window.top;}catch(e){return true;}})();
  if(!can&&!inFrame) return;
  b.hidden=false;
  const isFS=()=>!!(d.fullscreenElement||d.webkitFullscreenElement);
  const draw=()=>{ b.innerHTML=ic(isFS()?'exitfull':'full'); b.title=b.ariaLabel=isFS()?'Ukončiť celú obrazovku':(can?'Na celú obrazovku':'Otvoriť v novom okne'); };
  b.addEventListener('click',()=>{
    if(can){ if(isFS()) (d.exitFullscreen||d.webkitExitFullscreen).call(d); else { const r=(root.requestFullscreen||root.webkitRequestFullscreen); try{ const pr=r.call(root); if(pr&&pr.catch) pr.catch(()=>{ if(inFrame) window.open(location.href,'_blank'); }); }catch(e){ if(inFrame) window.open(location.href,'_blank'); } } }
    else window.open(location.href,'_blank');
  });
  d.addEventListener('fullscreenchange',draw); d.addEventListener('webkitfullscreenchange',draw); draw();
})();
